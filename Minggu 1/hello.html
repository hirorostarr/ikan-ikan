<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Clicker Game - Grazielle Joanne D.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease;
            background-color: #000000; /* Latar belakang Hitam */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas untuk efek emoji & jejak */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Papan Skor */
        #scoreBoard {
            position: absolute;
            top: 30px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Tombol Utama HELLO WORLD */
        #targetBtn {
            position: absolute;
            padding: 20px 40px;
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            border: 4px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            transition: transform 0.1s ease;
            z-index: 10;
            outline: none;
        }

        #targetBtn:active {
            transform: scale(0.92);
        }

        /* Tombol RESTART (Bawah Kanan) */
        #restartBtn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ffffff;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: all 0.3s ease;
        }

        #restartBtn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
        }

        /* Identitas Nama (Bawah Kiri) */
        #credits {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">POIN: <span id="score">0</span></div>

    <button id="targetBtn">HELLO WORLD</button>

    <canvas id="gameCanvas"></canvas>

    <div id="credits">Grazielle Joanne D.9C</div>
    <button id="restartBtn">RESTART</button>

    <script>
        const targetBtn = document.getElementById('targetBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreEl = document.getElementById('score');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let particles = [];
        let animationFrameId;

        // Daftar warna latar belakang (tetap berpindah warna saat diklik, lalu bisa di-restart ke Hitam)
        const bgColors = [
            '#800020', // Maroon
            '#87CEEB', // Biru Langit
            '#D2B48C', // Cokelat Muda
            '#362511', // Espresso
            '#8A68A8', // Taro
            '#84A98C'  // Matcha
        ];

        // Daftar emoji wajah
        const faceEmojis = ['😀', '😂', '🥳', '😎', '🤩', '😜', '🤪', '😍', '🤯', '👻', '🤖', '👾'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Partikel Emoji Cepat & Dinamis
        class EmojiParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.emoji = faceEmojis[Math.floor(Math.random() * faceEmojis.length)];
                this.size = Math.random() * 20 + 25; // Ukuran emoji
                
                // Kecepatan tinggi (tanpa slow-motion)
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 18 + 10; // Lebih cepat & meluncur jauh
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.gravity = 0.4; // Gravitasi cepat
                this.friction = 0.96; // Gesekan sedikit agar gerakan meluncur cepat
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02; // Hilang lebih cepat
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        // Loop Animasi Canvas dengan Jejak Cepat
        function animate() {
            // Efek jejak di latar belakang
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        }
        animate();

        // Ledakan Kembang Api Emoji
        function createFireworks(x, y) {
            const particleCount = 45;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new EmojiParticle(x, y));
            }
        }

        // Posisi Acak Tombol
        function moveButtonRandomly() {
            const btnWidth = targetBtn.offsetWidth;
            const btnHeight = targetBtn.offsetHeight;
            
            const padding = 40; 
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            targetBtn.style.left = `${randomX}px`;
            targetBtn.style.top = `${randomY}px`;
            targetBtn.style.transform = 'none';
        }

        // Event Klik Tombol
        targetBtn.addEventListener('click', (e) => {
            score++;
            scoreEl.textContent = score;

            // Ganti latar belakang secara acak
            const randomColor = bgColors[Math.floor(Math.random() * bgColors.length)];
            document.body.style.backgroundColor = randomColor;

            const rect = targetBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createFireworks(centerX, centerY);

            moveButtonRandomly();
        });

        // Restart Game
        function restartGame() {
            score = 0;
            scoreEl.textContent = score;
            document.body.style.backgroundColor = '#000000'; // Kembali ke warna Hitam
            
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            targetBtn.style.left = '50%';
            targetBtn.style.top = '50%';
            targetBtn.style.transform = 'translate(-50%, -50%)';
        }

        restartBtn.addEventListener('click', restartGame);

        restartGame();
    </script>
</body>
</html>
